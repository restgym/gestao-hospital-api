# RESTgym API manifest
manifest_version: 1

id: gestao-hospital
name: Gestão Hospitalar
version: "0.0.1"                  # gestaohospitalar-0.0.1.jar
description: Hospital management system (hospitals, patients, beds and stock), from the Codenation AceleraDev challenge.
domain: healthcare
# license:                        # not declared in the upstream repository
repository: https://github.com/ValchanOficial/GestaoHospital    # also included in https://github.com/WebFuzzing/Dataset
technology:
  language: java
  framework: Spring Boot          # 2.1.3
  database: MongoDB               # 6.0, in the container, empty at each start; the API inserts its sample data at startup (Instantiation)

original_specification:           # Swagger 2.0, served by the API at /v2/api-docs (springfox)
  version: "2.0"
  format: json
  origin: generated
  created_by: springfox 2.6.1
  file: original/gestao-hospital-swagger.json
  source: "runtime: /v2/api-docs"

authentication: none

# 5XX responses are the default error of Spring with its message: the message is kept, with the values of the request
# in it replaced (the value of an extra field in a query of MongoDB, an input string, the string of an invalid BSON
# cstring) and numbers masked; the HTML page of Spring (Whitelabel Error Page) is reduced to the same message
# Threshold: just above the highest similarity between two different failures in the runs of rest-league-2027-official,
# 0.615 (an invalid regular expression or a negative $maxDistance in a query of MongoDB)
server_errors:
  similarity_threshold: 0.62
  preprocessing:
    - json_fields: {fields: [message]}
    - replace: {pattern: '(Extra field found: [^:'']+:) [^'']*', with: '\1 <value>'}
    - replace: {pattern: '(?s)For input string: .*', with: 'For input string: <value>'}
    - mask: [numbers]
    - replace: {pattern: '(?s)^<html><body><h1>Whitelabel Error Page</h1>.*?status=<number>\)\.</div><div>(.*)</div></body></html>$', with: '\1'}
    - replace: {pattern: '&#<number>;', with: ''''}
    - replace: {pattern: '(?s)(BSON cstring) ''.*?'' (is not valid)', with: '\1 <value> \2'}

# Creating a hospital geocodes its address with LocationIQ: the container runs a mock of it (location-iq-mock/), so the
# API needs no internet access
requirements:
  internet: false
